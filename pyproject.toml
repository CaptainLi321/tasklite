[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklite-engine"
dynamic = ["version"]

description = "A lightweight task orchestration engine with zero external dependencies, process isolation, and ACID persistence"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

# PEP 639：license 以 SPDX 表达式声明，与 License 分类器互斥，不得再列 MIT classifier
keywords = ["task-queue", "task-orchestration", "background-jobs", "subprocess", "process-isolation", "acid", "workflow"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CaptainLi321/tasklite"
Repository = "https://github.com/CaptainLi321/tasklite"

[project.optional-dependencies]
dev = ["pytest", "hypothesis>=6.0", "mutmut>=3.0", "pytest-timeout>=2.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["tasklite", "tasklite.*"]
exclude = ["tests"]

# 版本单一事实源：tasklite/__init__.py 的 __version__，构建时动态读取
[tool.setuptools.dynamic]
version = { attr = "tasklite.__version__" }

# PEP 561：py.typed 标记随包分发，下游 mypy/pyright 可消费内联类型注解
[tool.setuptools.package-data]
tasklite = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "hypothesis: property-based tests using hypothesis (can be deselected with -m \"not hypothesis\")",
]
addopts = "--strict-markers"
timeout = 60
norecursedirs = ["mutants", ".git", ".hypothesis", "__pycache__"]

[tool.coverage.run]
source = ["tasklite"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = [
    "tasklite/backend/",
    "tasklite/engine/",
    "tasklite/models/",
    "tasklite/utils/",
    "tasklite/wrappers/",
    "tasklite/exceptions.py",
    "tasklite/pipeline.py",
]
also_copy = ["tasklite/"]
pytest_add_cli_args = ["--import-mode=importlib"]
